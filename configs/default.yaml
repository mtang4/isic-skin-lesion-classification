# ISIC 2019 Skin Lesion Classification with DINOv2
# Default configuration

data:
  data_dir: ./data
  image_size: 224
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  backbone: facebook/dinov2-base  # Options: facebook/dinov2-small, facebook/dinov2-base, facebook/dinov2-large
  num_classes: 8
  dropout: 0.1
  mode: linear_probe  # Options: linear_probe, fine_tune

training:
  batch_size: 64
  epochs: 30
  lr: 1.0e-3            # Learning rate for classifier head
  backbone_lr: 1.0e-5   # Learning rate for backbone (used in fine_tune mode)
  weight_decay: 1.0e-4
  scheduler: cosine      # Options: cosine, step
  warmup_epochs: 3
  label_smoothing: 0.1
  use_class_weights: true
  mixed_precision: true

output:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
